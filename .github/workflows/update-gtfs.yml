name: 每日更新线路资料

on:
  schedule:
    - cron: "17 19 * * *"   # 每天 UTC 19:17 = 吉隆坡时间凌晨 3:17
  workflow_dispatch:        # 允许在网页上手动点按钮运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 下载并解析静态 GTFS
        run: python scripts/build_static.py
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "资料无变化"; else git commit -m "自动更新线路资料 $(date -u +%F)" && git push; fi
